[package]
name = "com2usb"
version = "1.0.0"
description = "COM2USB - capturador serial de leitor de codigo de barras para a bandeja do Windows"
license = "GPL-3.0-only"
authors = ["PLUGGOR TECNOLOGIA LTDA"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serialport = "4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
